<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Charcoal ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/tables.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
</head>
<body>
  <div class="layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="page-title">Customers</h1>
          <p style="color: var(--text-muted);">Manage your clients and their balances.</p>
        </div>
        <button class="btn-primary" onclick="openCustomerModal()"><i class="fa-solid fa-plus"></i> Add Customer</button>
      </div>

      <div class="card page-transition">
        <table id="customersTable" class="display" style="width:100%">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Address</th>
              <th>GST</th>
              <th>Pending Balance</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>

      <div id="footer-container"></div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="customerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Customer</h3>
        <button class="modal-close" onclick="closeCustomerModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="customerForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" class="form-control" id="custName" required placeholder="e.g. Global Energy">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" class="form-control" id="custPhone" required placeholder="+1 234 567">
          </div>
          <div class="form-group">
            <label>GST No.</label>
            <input type="text" class="form-control" id="custGst" placeholder="Optional">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Address</label>
            <input type="text" class="form-control" id="custAddress" required>
          </div>
          <div class="form-group">
            <label>Opening Balance</label>
            <input type="number" class="form-control" id="custBalance" value="0">
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top: 15px;">Save Customer</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/api.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
  <script src="assets/js/customers.js"></script>
</body>
</html>
