<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Charcoal ERP</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1587841103254-47f6d14dfce1?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(17, 17, 17, 0.7);
    }

    .login-box {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: var(--border-radius);
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .login-box h1 {
      color: white;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .login-box h1 i {
      color: var(--primary-accent);
    }

    .form-group label {
      text-align: left;
      color: #ddd;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      margin-top: 20px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .options a {
      color: var(--primary-accent);
      text-decoration: none;
    }

    .options a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body data-theme="dark">
  <div class="overlay"></div>
  <div class="login-box glass-panel page-transition">
    <div style="margin-bottom:20px;">
      <img src="assets/images/logo.png" style="height:64px; width:auto; border-radius:8px;" alt="Logo">
    </div>
    <form action="dashboard.html" method="GET">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="admin@charcoal.com" required
          value="admin@charcoal.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="admin123">
          <i class="fa-solid fa-eye" id="togglePassword"
            style="position:absolute; right:15px; top:15px; cursor:pointer; color:#888;"></i>
        </div>
      </div>
      <div class="options">
        <label><input type="checkbox" checked> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="btn-primary btn-login">Login to Dashboard <i
          class="fa-solid fa-arrow-right"></i></button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/api.js?v=2"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      const p = document.getElementById('password');
      if (p.type === 'password') {
        p.type = 'text';
        this.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        p.type = 'password';
        this.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    document.querySelector('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('.btn-login');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
      btn.disabled = true;

      try {
        // Our Django username field might be expecting the username, but we pass the username part of the email or just 'admin'.
        // For testing, we created 'admin' / 'admin123'. Let's use the actual input.
        const username = email.split('@')[0]; // simple hack if user types admin@charcoal.com
        await loginUser(username, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        Swal.fire('Login Failed', error.message, 'error');
        btn.innerHTML = 'Login to Dashboard <i class="fa-solid fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
