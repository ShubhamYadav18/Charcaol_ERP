<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - Charcoal ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/tables.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
</head>
<body>
  <div class="layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="page-title">Suppliers</h1>
          <p style="color: var(--text-muted);">Manage your coal suppliers and payables.</p>
        </div>
        <button class="btn-primary" onclick="openSupplierModal()"><i class="fa-solid fa-plus"></i> Add Supplier</button>
      </div>

      <div class="card page-transition">
        <table id="suppliersTable" class="display" style="width:100%">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Location</th>
              <th>Payable Balance</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>

      <div id="footer-container"></div>
    </div>
  </div>

  <div class="modal" id="supplierModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Supplier</h3>
        <button class="modal-close" onclick="closeSupplierModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="supplierForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Supplier Name</label>
          <input type="text" class="form-control" id="supName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Contact Person</label>
            <input type="text" class="form-control" id="supContact">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" class="form-control" id="supPhone" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Type</label>
            <select class="form-control" id="supType" required>
              <option value="Charcoal">Charcoal</option>
              <option value="Firewood">Firewood</option>
            </select>
          </div>
          <div class="form-group">
            <label>GST/Tax No.</label>
            <input type="text" class="form-control" id="supTax">
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" class="form-control" id="supAddress" required>
        </div>
        <button type="submit" class="btn-primary" style="width:100%">Save Supplier</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/api.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
  <script src="assets/js/suppliers.js"></script>
</body>
</html>
